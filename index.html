<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Insight Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --brand:        #0e5774;
            --brand-deep:   #0a3f54;
            --brand-mid:    #1470923a;
            --brand-light:  #e6f2f7;
            --brand-pale:   #f0f8fb;
            --accent:       #12a8d4;
            --accent-light: #d0eef8;
            --warm:         #f4a623;
            --warm-light:   #fef3dd;
            --danger:       #e0503c;
            --danger-light: #fcecea;
            --success:      #1a9e6e;
            --success-light:#e4f7f0;
            --text-primary: #0f2832;
            --text-secondary:#4a6875;
            --text-muted:   #8aaab5;
            --surface:      #ffffff;
            --surface-2:    #f5f9fb;
            --surface-3:    #edf4f7;
            --border:       #d0e5ed;
            --border-strong:#a8c8d8;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 22px;
            --shadow-sm: 0 1px 3px rgba(14,87,116,.08), 0 1px 2px rgba(14,87,116,.06);
            --shadow-md: 0 4px 16px rgba(14,87,116,.10), 0 2px 6px rgba(14,87,116,.07);
            --shadow-lg: 0 8px 32px rgba(14,87,116,.13), 0 4px 12px rgba(14,87,116,.08);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--surface-2);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(14,87,116,.055) 0%, transparent 55%),
                radial-gradient(circle at 80% 80%, rgba(18,168,212,.04) 0%, transparent 55%);
            pointer-events: none;
            z-index: 0;
        }

        /* ─── LOGIN ─── */
        #loginPage {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 1.5rem; position: relative; z-index: 1;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            width: 100%; max-width: 420px;
            padding: 2.75rem 2.5rem;
            animation: slideUp .45s cubic-bezier(.22,.68,0,1.2) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-icon {
            width: 56px; height: 56px; border-radius: var(--radius-md);
            background: var(--brand); display: flex; align-items: center; justify-content: center;
            margin-bottom: 1.5rem;
        }
        .login-icon svg { width: 26px; height: 26px; color: #fff; }

        .login-title { font-size: 1.6rem; font-weight: 700; color: var(--text-primary); letter-spacing: -.02em; line-height: 1.2; }
        .login-sub { font-size: .875rem; color: var(--text-secondary); margin-top: .35rem; margin-bottom: 2rem; }

        .form-label { display: block; font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: .45rem; }
        .form-input {
            width: 100%; padding: .8rem 1rem; font-family: 'DM Mono', monospace; font-size: .95rem;
            background: var(--surface-2); border: 1.5px solid var(--border); border-radius: var(--radius-md);
            color: var(--text-primary); outline: none; transition: all .18s;
        }
        .form-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(14,87,116,.12); background: var(--surface); }

        .btn-primary {
            width: 100%; padding: .85rem 1rem; margin-top: 1.25rem;
            background: var(--brand); color: #fff; font-weight: 600; border: none;
            border-radius: var(--radius-md); cursor: pointer; transition: all .18s;
            box-shadow: 0 3px 14px rgba(14,87,116,.28);
        }
        .btn-primary:hover { background: var(--brand-deep); box-shadow: 0 4px 20px rgba(14,87,116,.38); }

        .login-error {
            display: none; margin-top: .9rem; padding: .65rem .9rem; background: var(--danger-light);
            border: 1px solid rgba(224,80,60,.2); border-radius: var(--radius-sm); color: var(--danger);
            font-size: .82rem; font-weight: 600; text-align: center;
        }

        /* ─── PORTAL ─── */
        #portalPage { display: none; min-height: 100vh; position: relative; z-index: 1; }

        .topnav {
            background: var(--brand); position: sticky; top: 0; z-index: 100;
            padding: 0 2rem; display: flex; align-items: center; justify-content: space-between;
            height: 60px; box-shadow: 0 2px 16px rgba(14,87,116,.25);
        }

        .nav-brand { display: flex; align-items: center; gap: .75rem; }
        .nav-brand-icon { width: 32px; height: 32px; background: rgba(255,255,255,.18); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; }
        .nav-brand-icon svg { width: 16px; height: 16px; color: #fff; }
        .nav-brand-name { font-size: 1rem; font-weight: 700; color: #fff; letter-spacing: -.01em; }
        .nav-brand-name span { font-weight: 300; opacity: .7; }

        .btn-logout {
            display: flex; align-items: center; gap: .4rem; background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.85);
            font-size: .8rem; font-weight: 500; padding: .4rem .85rem; border-radius: var(--radius-sm);
            cursor: pointer; transition: background .18s;
        }
        .btn-logout:hover { background: rgba(255,255,255,.22); color: #fff; }

        .main-content { max-width: 1200px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

        .hero-strip {
            background: var(--brand); border-radius: var(--radius-xl); padding: 2.5rem 2.5rem;
            margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between;
            gap: 2rem; flex-wrap: wrap; box-shadow: var(--shadow-md); position: relative; overflow: hidden;
        }

        .hero-text h2 { font-size: 1.55rem; font-weight: 700; color: #fff; letter-spacing: -.02em; margin-bottom: .3rem; }
        .hero-text p { font-size: .875rem; color: rgba(255,255,255,.62); font-weight: 300; }

        .btn-upload {
            display: inline-flex; align-items: center; gap: .55rem; background: #fff;
            color: var(--brand); font-size: .875rem; font-weight: 700; padding: .75rem 1.4rem;
            border-radius: var(--radius-md); cursor: pointer; transition: all .15s;
            box-shadow: 0 2px 12px rgba(0,0,0,.15); white-space: nowrap;
        }
        .btn-upload:hover { transform: translateY(-1px); box-shadow: 0 4px 18px rgba(0,0,0,.2); }

        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: .75rem; }
        .section-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); }
        .section-count { font-size: .78rem; color: var(--text-muted); background: var(--surface-3); border: 1px solid var(--border); border-radius: 100px; padding: .2rem .7rem; }

        .btn-download {
            display: none; align-items: center; gap: .5rem; background: var(--success);
            color: #fff; font-size: .82rem; font-weight: 600; padding: .55rem 1.1rem;
            border-radius: var(--radius-md); border: none; cursor: pointer;
            transition: all .18s; box-shadow: 0 2px 10px rgba(26,158,110,.22);
        }

        #resultsGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 1.25rem; }

        /* ─── CARD DESIGN ─── */
        .emp-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column;
            transition: all .2s; animation: fadeCard .35s ease both;
        }
        @keyframes fadeCard { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .emp-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

        .card-header { background: var(--brand-pale); border-bottom: 1px solid var(--border); padding: 1.1rem 1.3rem; display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
        .emp-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--brand); color: #fff; font-size: .8rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
        .emp-name { font-size: .95rem; font-weight: 600; color: var(--text-primary); flex: 1; }
        .emp-mins-badge { background: var(--brand); color: #fff; border-radius: var(--radius-sm); padding: .35rem .7rem; text-align: center; }
        .emp-mins-badge .num { display: block; font-size: 1.1rem; font-weight: 700; line-height: 1; font-family: 'DM Mono', monospace; }
        .emp-mins-badge .lbl { display: block; font-size: .55rem; font-weight: 600; text-transform: uppercase; opacity: .75; }

        .card-body { padding: 1rem 1.3rem; flex: 1; }
        .log-row { display: flex; align-items: center; justify-content: space-between; padding: .55rem 0; border-bottom: 1px solid var(--surface-3); }
        .log-date { font-size: .82rem; font-weight: 600; color: var(--text-primary); }
        .tag-halfday { font-size: .65rem; font-weight: 700; text-transform: uppercase; background: var(--warm-light); color: var(--warm); padding: .15rem .5rem; border-radius: 100px; border: 1px solid rgba(244,166,35,.25); }
        .log-time { font-size: .82rem; font-weight: 700; color: var(--danger); font-family: 'DM Mono', monospace; }
        .log-late { font-size: .72rem; color: var(--text-muted); font-family: 'DM Mono', monospace; }

        .card-footer { background: var(--surface-2); border-top: 1px solid var(--border); padding: .7rem 1.3rem; display: flex; align-items: center; justify-content: space-between; }
        .footer-hd { display: flex; align-items: center; gap: .5rem; }
        .hd-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warm); }
        .footer-hd-count { font-size: .82rem; font-weight: 700; color: var(--warm); }

        .perfect-label { font-size: .8rem; font-weight: 600; color: var(--success); display: flex; align-items: center; gap: .4rem; }
        .empty-state { grid-column: 1 / -1; padding: 4rem 2rem; text-align: center; }
        .empty-icon svg { width: 28px; height: 28px; color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- ── LOGIN PAGE ── -->
    <div id="loginPage">
        <div class="login-card">
            <div class="login-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
            <h1 class="login-title">Admin Portal</h1>
            <p class="login-sub">Enter password to access Attendance Insights</p>
            <form id="loginForm">
                <label class="form-label">Password</label>
                <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required>
                <button type="submit" class="btn-primary">Access Portal</button>
                <p id="loginError" class="login-error">Incorrect password.</p>
            </form>
        </div>
    </div>

    <!-- ── PORTAL PAGE ── -->
    <div id="portalPage">
        <nav class="topnav">
            <div class="nav-brand">
                <div class="nav-brand-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg></div>
                <span class="nav-brand-name">Attendance <span>Insight Portal</span></span>
            </div>
            <button class="btn-logout" id="logoutBtn">Logout</button>
        </nav>

        <div class="main-content">
            <div class="hero-strip">
                <div class="hero-text">
                    <h2>Upload & Analyse</h2>
                    <p>Select your BasicWorkDurationReport.xls to start.</p>
                </div>
                <div class="hero-upload-area">
                    <input type="file" id="fileInput" accept=".xls,.xlsx" style="display:none;">
                    <label for="fileInput" class="btn-upload">Upload Report</label>
                    <span id="fileStatus" class="file-status">No file selected</span>
                </div>
            </div>

            <div class="section-header" id="sectionHeader" style="display:none;">
                <div style="display:flex; align-items:center; gap:.6rem;">
                    <span class="section-title">Employee Breakdown</span>
                    <span class="section-count" id="sectionCount">0 records</span>
                </div>
                <button class="btn-download" id="downloadBtn">Download XLSX</button>
            </div>

            <div id="resultsGrid">
                <div class="empty-state">
                    <h3>No data yet</h3>
                    <p>Upload a report to see employee records.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const APP_PASSWORD = "admin123";

        if (sessionStorage.getItem('isLoggedIn') === 'true') showPortal();

        document.getElementById('loginForm').addEventListener('submit', e => {
            e.preventDefault();
            if (document.getElementById('passwordInput').value === APP_PASSWORD) {
                sessionStorage.setItem('isLoggedIn', 'true');
                showPortal();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem('isLoggedIn');
            location.reload();
        });

        function showPortal() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('portalPage').style.display = 'block';
        }

        const SHIFT_START = 615; const HD_LIMIT = 690; const HD_START = 825; const SHIFT_END = 1035;
        let reportBuffer = [];

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0]; if (!file) return;
            document.getElementById('fileStatus').textContent = 'Processing: ' + file.name;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const workbook = XLSX.read(new Uint8Array(event.target.result), { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
                    processData(rows);
                } catch (err) { alert(err.message); }
            };
            reader.readAsArrayBuffer(file);
        });

        function timeToMins(t) {
            if (!t || typeof t !== 'string' || !t.includes(':')) return null;
            const parts = t.trim().split(':');
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        function processData(rows) {
            const grid = document.getElementById('resultsGrid'); grid.innerHTML = '';
            reportBuffer = [];
            const dayMap = {}; let dayRowIdx = -1;

            for (let i = 0; i < 15; i++) {
                const count = (rows[i] || []).filter(c => !isNaN(parseInt(String(c).split(' ')[0], 10))).length;
                if (count >= 5) { dayRowIdx = i; break; }
            }
            if (dayRowIdx !== -1) {
                rows[dayRowIdx].forEach((cell, idx) => {
                    const n = parseInt(String(cell).split(' ')[0], 10);
                    if (!isNaN(n)) dayMap[idx] = n;
                });
            }

            let currentEmp = null;
            rows.forEach(row => {
                if (!row) return;
                for (let c = 0; c < row.length - 1; c++) {
                    if (row[c] === 'Emp. Name:') {
                        for (let k = c + 1; k < row.length; k++) { if (row[k]) { currentEmp = String(row[k]).trim(); break; } }
                        break;
                    }
                }
                if (currentEmp && row[0] === 'InTime' && Object.keys(dayMap).length > 0) {
                    const lates = [];
                    Object.entries(dayMap).forEach(([idx, day]) => {
                        const time = row[parseInt(idx)] ? String(row[parseInt(idx)]).trim() : null;
                        const mins = timeToMins(time);
                        if (mins !== null && mins < SHIFT_END) {
                            let late = 0, status = 'Late';
                            if (mins > HD_LIMIT) { status = 'Half Day'; if (mins > HD_START) late = mins - HD_START; }
                            else if (mins > SHIFT_START) late = mins - SHIFT_START;
                            if (late > 0 || status === 'Half Day') lates.push({ date: day, time, late, status });
                        }
                    });
                    const totalMins = lates.reduce((s, i) => s + i.late, 0);
                    const hds = lates.filter(l => l.status === 'Half Day').length;
                    reportBuffer.push({ 'Sl No': reportBuffer.length+1, 'Employee Name': currentEmp, 'Total Late Mins': totalMins, 'Half Day Count': hds, 'Logs': lates.map(l => `${l.date}: ${l.time}`).join('; ') });
                    renderCard(currentEmp, lates, totalMins, hds);
                    currentEmp = null;
                }
            });

            document.getElementById('sectionHeader').style.display = 'flex';
            document.getElementById('sectionCount').textContent = reportBuffer.length + ' records';
            document.getElementById('downloadBtn').style.display = reportBuffer.length ? 'flex' : 'none';
        }

        function renderCard(name, lates, total, hds) {
            const card = document.createElement('div'); card.className = 'emp-card';
            const logRows = lates.map(l => `
                <div class="log-row">
                    <span class="log-date">Day ${l.date}</span>
                    <div class="log-tags">${l.status==='Half Day'?'<span class="tag-halfday">HD</span>':''}<span class="log-time">${l.time}</span></div>
                    <span class="log-late">+${l.late}m</span>
                </div>`).join('');

            card.innerHTML = `
                <div class="card-header">
                    <div class="emp-avatar">${name[0]}</div>
                    <div class="emp-name">${name}</div>
                    <div class="emp-mins-badge"><span class="num">${total}</span><span class="lbl">mins</span></div>
                </div>
                <div class="card-body">${lates.length ? logRows : '<div class="perfect-label">Perfect attendance</div>'}</div>
                <div class="card-footer">${hds > 0 ? `<div class="footer-hd"><div class="hd-dot"></div><span>Half Days</span></div><span class="footer-hd-count">${hds}</span>` : `<span>${lates.length} instances</span>`}</div>`;
            document.getElementById('resultsGrid').appendChild(card);
        }

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const ws = XLSX.utils.json_to_sheet(reportBuffer);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Summary');
            XLSX.writeFile(wb, 'Attendance_Report.xlsx');
        });
    </script>
</body>
</html>
